<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>RESPONSIVE TEST — HM://PORTFOLIO</title>
<style>
  :root { --cyan:#1dd4d4; --red:#e81c28; --green:#2de89a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:#00040a; color:#d9f3ff;
    font-family:'JetBrains Mono','Consolas',monospace;
    padding:28px 32px 60px;
  }
  h1 { font-size:15px; letter-spacing:0.3em; color:var(--cyan); margin-bottom:4px; }
  .sub { font-size:11px; color:rgba(180,200,215,0.55); letter-spacing:0.12em; margin-bottom:26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(560px, 1fr)); gap:28px; }
  .case { border:1px solid rgba(29,212,212,0.22); background:rgba(0,8,16,0.6); padding:14px; }
  .case-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .case-name { font-size:12px; letter-spacing:0.22em; color:#fff; }
  .case-res  { font-size:10px; color:rgba(180,200,215,0.6); }
  .status { font-size:11px; letter-spacing:0.18em; padding:2px 10px; border:1px solid; }
  .status.wait { color:#9fb4c4; border-color:rgba(159,180,196,0.4); }
  .status.pass { color:var(--green); border-color:var(--green); }
  .status.fail { color:#ff5c66; border-color:#ff5c66; }
  .vp-box { position:relative; overflow:hidden; background:#000; border:1px solid rgba(29,212,212,0.14); }
  .vp-box iframe { position:absolute; top:0; left:0; border:0; transform-origin:top left; }
  .meta { margin-top:8px; font-size:10px; line-height:1.8; color:rgba(180,200,215,0.7); }
  .meta b { color:#fff; font-weight:normal; }
  .issues { margin-top:6px; font-size:10px; line-height:1.7; color:#ff8d96;
            border-top:1px solid rgba(232,28,40,0.3); padding-top:5px; }
</style>
</head>
<body>
  <h1>◈ RESPONSIVE TEST HARNESS</h1>
  <div class="sub">Ogni profilo carica il portfolio alla risoluzione reale e riceve l'audit automatico (overflow + collisioni) via postMessage. Apri questo file e attendi qualche secondo dopo il boot del loader.</div>
  <div class="grid" id="grid"></div>

<script>
(function () {
  'use strict';
  var CASES = [
    /* ── small end (320 → 900px): il fuoco del lavoro responsive ── */
    { name: 'PHONE — SMALL',     w: 320,  h: 568  },
    { name: 'PHONE',             w: 360,  h: 640  },
    { name: 'PHONE — LARGE',     w: 414,  h: 896  },
    { name: 'PHONE — LANDSCAPE', w: 812,  h: 375  },
    { name: 'TABLET (PORTRAIT)', w: 768,  h: 1024 },
    /* ── desktop → 4K (già validato in MK11/MK12) ── */
    { name: 'LAPTOP',         w: 1366, h: 768  },
    { name: 'DESKTOP',        w: 1920, h: 1080 },
    { name: 'LARGE MONITOR',  w: 2560, h: 1440 },
    { name: 'TV / PROJECTOR', w: 3840, h: 2160 }
  ];
  var PREVIEW_W = 620;   /* larghezza max resa di ogni anteprima */
  var grid = document.getElementById('grid');
  var entries = [];

  CASES.forEach(function (c, idx) {
    /* non ingrandire i viewport piccoli (telefoni): resa a px reali
       fino a PREVIEW_W, solo i grandi vengono ridotti in scala */
    var scale = Math.min(1, PREVIEW_W / c.w);
    var box = document.createElement('div');
    box.className = 'case';
    box.innerHTML =
      '<div class="case-head">' +
        '<span class="case-name">' + c.name + '</span>' +
        '<span class="case-res">' + c.w + '×' + c.h + '</span>' +
        '<span class="status wait" id="st-' + idx + '">WAITING…</span>' +
      '</div>' +
      '<div class="vp-box" style="height:' + Math.round(c.h * scale) + 'px"></div>' +
      '<div class="meta" id="meta-' + idx + '">in caricamento…</div>';
    grid.appendChild(box);

    var frame = document.createElement('iframe');
    frame.src = './index.html';
    frame.width  = c.w;
    frame.height = c.h;
    frame.style.width  = c.w + 'px';
    frame.style.height = c.h + 'px';
    frame.style.transform = 'scale(' + scale + ')';
    box.querySelector('.vp-box').appendChild(frame);
    entries.push({ frame: frame, idx: idx, done: false });
  });

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'hm-audit-result') return;
    var a = e.data.payload;
    entries.forEach(function (en) {
      if (en.frame.contentWindow !== e.source) return;
      en.done = true;
      var st = document.getElementById('st-' + en.idx);
      st.textContent = a.pass ? 'PASS' : 'FAIL (' + a.issues.length + ')';
      st.className = 'status ' + (a.pass ? 'pass' : 'fail');
      document.getElementById('meta-' + en.idx).innerHTML =
        'viewport <b>' + a.viewport + '</b> · ui-scale <b>' + a.scale + '</b> · ' +
        'root <b>' + a.rootFont + '</b> · profilo <b>' + a.profile + '</b>' +
        (a.pass ? '' : '<div class="issues">' +
          a.issues.map(function (i) { return '▸ ' + i; }).join('<br>') + '</div>');
    });
  });

  /* interroga finché tutte le iframe non rispondono (il loader del
     portfolio impiega qualche secondo prima del layout definitivo) */
  var tries = 0;
  var poll = setInterval(function () {
    tries++;
    var open = false;
    entries.forEach(function (en) {
      if (en.done) return;
      open = true;
      try { en.frame.contentWindow.postMessage({ type: 'hm-audit-request' }, '*'); } catch (_) {}
    });
    if (!open || tries > 40) clearInterval(poll);
  }, 1500);
})();
</script>
</body>
</html>
